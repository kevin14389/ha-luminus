# =============================================================================
# Luminus Comfy Electricité - Calcul automatique du prix de l'électricité
# =============================================================================
# Contrat  : Luminus Comfy Electricité (fixe) - fiche tarifaire juillet 2025
# Client   : résidentiel, Léglise (province de Luxembourg) - Région wallonne
# Réseau   : ORES Luxembourg - compteur digital, mono-horaire
# Régime   : Prosumer avec compteur communicant. IMPORTANT (corrigé après
#            analyse d'un vrai décompte annuel Luminus) : il n'y a PAS de
#            tarif prosumer forfaitaire (€/kW/an) sur ce contrat - celui-ci
#            ne s'applique qu'aux compteurs analogiques inversés. Avec un
#            compteur digital, ORES facture le réseau (ELIA + ORES
#            Luxembourg) sur le prélèvement BRUT, avec un "Ristorno"
#            (remise) pour la production décentralisée. On modélise ça avec
#            un taux réseau "combiné" (voir ores_cout_reseau_variable
#            ci-dessous), calculé à partir du total réel HTVA
#            ELIA + ORES divisé par la conso NETTE annuelle - ça reproduit
#            le bon coût total sans avoir à suivre les kWh bruts (que ce
#            package ne mesure pas).
#
# Toutes les valeurs tarifaires sont des input_number modifiables depuis
# Paramètres > Appareils et services > Aides, SANS toucher à ce fichier.
# Mets-les à jour quand Luminus ou ORES publient de nouveaux tarifs, ou
# quand tu reçois un nouveau décompte annuel Luminus (le plus fiable : il
# donne les vrais montants HTVA payés à Luminus/ELIA/ORES/gouvernement) :
#   - Luminus (prix énergie, redevance fixe, coûts énergie verte) :
#     nouvelle fiche tarifaire sur My Luminus, ou décompte annuel.
#   - ores_cout_reseau_variable : recalcule-le à chaque décompte annuel via
#     (Montant ELIA + Montant ORES − Terme fixe ORES) ÷ conso nette (kWh)
#     de la période, le tout HTVA (voir le détail "Electricité : Détails de
#     votre montant" de ton décompte).
#   - Taxes fédérales/régionales (accise, cotisation énergie, redevance de
#     raccordement) : revues par le SPF Finances / la Région wallonne,
#     généralement en janvier - mais la réforme des accises de 2025 a déjà
#     changé ce taux en cours d'année, vérifie ton décompte plutôt que les
#     anciennes fiches tarifaires.
#
# Simplifications assumées (à corriger manuellement si ta situation change) :
#   - Redevance de raccordement : appliquée sur toute la consommation,
#     sans tenir compte de l'exemption des 100 premiers kWh/an (montant
#     négligeable : 0,075 c€/kWh).
#   - Coûts énergie verte : varie chaque trimestre, la valeur ci-dessous est
#     celle du dernier trimestre connu (Q3 2025) - à rafraîchir si tu veux
#     rester précis, ou laisser tel quel comme bonne approximation.
#   - Taux réseau combiné (ores_cout_reseau_variable) : c'est une MOYENNE
#     annuelle réelle, pas le détail des ~11 sous-composantes ELIA/ORES
#     (E210, E520, E650, E850...). Comme ton ratio prélèvement brut/net
#     dépend de ta production solaire (donc de la saison), ce taux moyen
#     sous-estime probablement le coût réseau en hiver (peu de solaire, brut
#     ≈ net) et le surestime un peu en été (forte autoconsommation) - mais
#     il redonne le bon total sur une année complète.
# =============================================================================

input_number:
  # --- 1. Prix de l'énergie fournie par Luminus ---
  luminus_prix_energie_ttc:
    name: "Luminus - Prix énergie fournie (TTC)"
    icon: mdi:flash
    unit_of_measurement: "c€/kWh"
    min: 0
    max: 100
    step: 0.01
    initial: 18.73

  luminus_redevance_fixe_annuelle:
    name: "Luminus - Redevance fixe annuelle (TTC)"
    icon: mdi:file-document-outline
    unit_of_measurement: "€/an"
    min: 0
    max: 500
    step: 0.01
    initial: 65.00

  # --- 2. Coûts d'utilisation du réseau - ELIA (transport) + ORES Luxembourg
  #     (distribution), combinés en un taux moyen réel (voir note en tête de
  #     fichier). Calculé à partir du décompte annuel 01.12.2024-30.11.2025 :
  #     (300,44€ ELIA + 823,92€ ORES − 13,04€ terme fixe) ÷ 6.311,33 kWh nets
  #     = 17,61 c€/kWh. Recalcule cette formule à chaque nouveau décompte. ---
  ores_cout_reseau_variable:
    name: "ELIA + ORES - Coût réseau combiné (HTVA)"
    icon: mdi:transmission-tower
    unit_of_measurement: "c€/kWh"
    min: 0
    max: 50
    step: 0.01
    initial: 17.61

  ores_terme_fixe_grd:
    name: "ORES - Terme fixe GRD / gestion des données (HTVA)"
    icon: mdi:file-document-outline
    unit_of_measurement: "€/an"
    min: 0
    max: 100
    step: 0.01
    initial: 13.06

  # --- 3. Taxes et redevances (Région wallonne / fédéral) ---
  taxe_accise_special:
    name: "Taxe - Droit d'accise spécial (HTVA)"
    icon: mdi:bank
    unit_of_measurement: "c€/kWh"
    min: 0
    max: 20
    step: 0.0001
    initial: 4.7480

  taxe_cotisation_energie:
    name: "Taxe - Cotisation sur l'énergie (HTVA)"
    icon: mdi:bank
    unit_of_measurement: "c€/kWh"
    min: 0
    max: 5
    step: 0.0001
    initial: 0.1927

  luminus_cout_energie_verte:
    name: "Luminus - Coûts énergie verte (HTVA)"
    icon: mdi:leaf
    unit_of_measurement: "c€/kWh"
    min: 0
    max: 10
    step: 0.0001
    initial: 2.8281

  taxe_redevance_raccordement:
    name: "Taxe - Redevance de raccordement (HTVA)"
    icon: mdi:bank
    unit_of_measurement: "c€/kWh"
    min: 0
    max: 5
    step: 0.0001
    initial: 0.0750

  # --- TVA ---
  taux_tva:
    name: "Taux de TVA électricité"
    icon: mdi:percent
    unit_of_measurement: "%"
    min: 0
    max: 25
    step: 0.5
    initial: 6

  # --- Remises de fidélité (domiciliation), désactivées par défaut ---
  remise_fidelite_12_mois:
    name: "Remise fidélité après 12 mois"
    icon: mdi:percent
    unit_of_measurement: "%"
    min: 0
    max: 50
    step: 0.5
    initial: 5

  remise_fidelite_24_mois:
    name: "Remise fidélité après 24 mois"
    icon: mdi:percent
    unit_of_measurement: "%"
    min: 0
    max: 50
    step: 0.5
    initial: 10

  # --- Accumulateurs internes : somme des coûts journaliers déjà figés,
  #     jour par jour, chacun avec le prix qui était en vigueur ce jour-là.
  #     Ne pas modifier manuellement (remis à 0 automatiquement au 1er du
  #     mois / au 1er janvier, incrémentés chaque soir à 23h55). ---
  luminus_cout_accumulateur_mois:
    name: "Luminus - Accumulateur coût mensuel (interne)"
    icon: mdi:cash-sync
    unit_of_measurement: "EUR"
    min: 0
    max: 10000
    step: 0.01
    initial: 0

  luminus_cout_accumulateur_annee:
    name: "Luminus - Accumulateur coût annuel (interne)"
    icon: mdi:cash-sync
    unit_of_measurement: "EUR"
    min: 0
    max: 10000
    step: 0.01
    initial: 0

  # --- Changement de prix programmé à l'avance (ex. indexation Luminus
  #     annoncée pour le 15/09 : encode-le dès que tu reçois le courrier,
  #     il s'appliquera tout seul le bon jour). ---
  luminus_prix_energie_ttc_prochain:
    name: "Luminus - Prochain prix énergie programmé (TTC)"
    icon: mdi:calendar-clock
    unit_of_measurement: "c€/kWh"
    min: 0
    max: 100
    step: 0.01
    initial: 0

  # --- Correction manuelle ponctuelle, pour rattraper un changement de
  #     tarif que tu as encodé en retard (voir bouton "Appliquer la
  #     correction manuelle" plus bas). Calcule-la comme :
  #     kWh consommés pendant la période ratée × (nouveau - ancien prix,
  #     en EUR/kWh). Peut être négative si tu as trop compté. ---
  luminus_correction_manuelle:
    name: "Luminus - Correction manuelle à appliquer (EUR)"
    icon: mdi:calculator
    unit_of_measurement: "EUR"
    min: -1000
    max: 1000
    step: 0.01
    initial: 0

input_boolean:
  luminus_remise_fidelite_active:
    name: "Remise fidélité domiciliation active"
    icon: mdi:cash-check
    initial: false

  luminus_changement_prix_programme:
    name: "Luminus - Changement de prix programmé actif"
    icon: mdi:calendar-clock
    initial: false

input_datetime:
  luminus_date_debut_contrat:
    name: "Date de début du contrat Luminus"
    has_date: true
    has_time: false
    initial: "2024-01-01"

  luminus_prix_energie_date_effet:
    name: "Luminus - Date d'entrée en vigueur du prochain prix"
    has_date: true
    has_time: false
    initial: "2024-01-01"

input_button:
  luminus_appliquer_correction_manuelle:
    name: "Luminus - Appliquer la correction manuelle"
    icon: mdi:calculator-variant

# =============================================================================
# Suivi de la consommation - basé sur le capteur du compteur communicant
# =============================================================================
utility_meter:
  # Pas de "name:" ici volontairement : quand un nom est fourni, HA génère
  # l'entity_id en le slugifiant (ex. "Consommation de l'année" devient
  # sensor.luminus_consommation_de_l_annee), ce qui casse la correspondance
  # avec les entity_id utilisés partout ailleurs dans ce fichier et dans le
  # dashboard. Sans "name:", l'entity_id suit directement la clé YAML
  # ci-dessous (sensor.luminus_conso_jour, etc.) - stable et prévisible.
  # Tu peux renommer l'affichage ("friendly name") depuis Paramètres >
  # Entités sans risque, ça ne touche pas l'entity_id.
  luminus_conso_jour:
    source: sensor.daily_energy_delivered_peak
    cycle: daily

  luminus_conso_mois:
    source: sensor.daily_energy_delivered_peak
    cycle: monthly

  luminus_conso_annee:
    source: sensor.daily_energy_delivered_peak
    cycle: yearly

# =============================================================================
# Calcul du prix et du coût
# =============================================================================
template:
  - trigger:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: state
        entity_id:
          - input_number.luminus_prix_energie_ttc
          - input_number.luminus_redevance_fixe_annuelle
          - input_number.ores_cout_reseau_variable
          - input_number.ores_terme_fixe_grd
          - input_number.taxe_accise_special
          - input_number.taxe_cotisation_energie
          - input_number.taxe_redevance_raccordement
          - input_number.luminus_cout_energie_verte
          - input_number.taux_tva
          - input_number.remise_fidelite_12_mois
          - input_number.remise_fidelite_24_mois
          - input_boolean.luminus_remise_fidelite_active
          - input_datetime.luminus_date_debut_contrat
    sensor:
      - name: "Luminus Prix kWh TTC"
        unique_id: luminus_prix_kwh_ttc
        icon: mdi:cash-multiple
        unit_of_measurement: "c€/kWh"
        state: >
          {% set tva = states('input_number.taux_tva') | float(0) %}

          {# Prix de l'énergie, converti HTVA pour pouvoir appliquer la remise fidélité #}
          {% set energie_ttc = states('input_number.luminus_prix_energie_ttc') | float(0) %}
          {% set energie_ht = energie_ttc / (1 + tva / 100) %}

          {% if is_state('input_boolean.luminus_remise_fidelite_active', 'on') %}
            {% set debut = states('input_datetime.luminus_date_debut_contrat') %}
            {% set jours = (now().date() - strptime(debut, '%Y-%m-%d').date()).days %}
            {% set mois = jours / 30.44 %}
            {% set r24 = states('input_number.remise_fidelite_24_mois') | float(0) %}
            {% set r12 = states('input_number.remise_fidelite_12_mois') | float(0) %}
            {% if mois >= 24 %}
              {% set energie_ht = energie_ht * (1 - r24 / 100) %}
            {% elif mois >= 12 %}
              {% set energie_ht = energie_ht * (1 - r12 / 100) %}
            {% endif %}
          {% endif %}

          {# Coûts réseau combiné (ELIA+ORES), énergie verte et taxes, tous HTVA #}
          {% set reseau = states('input_number.ores_cout_reseau_variable') | float(0) %}
          {% set energie_verte = states('input_number.luminus_cout_energie_verte') | float(0) %}
          {% set accise = states('input_number.taxe_accise_special') | float(0) %}
          {% set cotisation = states('input_number.taxe_cotisation_energie') | float(0) %}
          {% set raccordement = states('input_number.taxe_redevance_raccordement') | float(0) %}

          {% set total_ht = energie_ht + reseau + energie_verte + accise + cotisation + raccordement %}
          {{ (total_ht * (1 + tva / 100)) | round(4) }}

      - name: "Luminus Cout Fixe Journalier"
        unique_id: luminus_cout_fixe_journalier
        icon: mdi:calendar-today
        unit_of_measurement: "EUR"
        device_class: monetary
        state: >
          {% set tva = states('input_number.taux_tva') | float(0) %}
          {% set redevance_ttc = states('input_number.luminus_redevance_fixe_annuelle') | float(0) %}
          {% set grd = states('input_number.ores_terme_fixe_grd') | float(0) %}
          {% set grd_ttc = grd * (1 + tva / 100) %}
          {{ ((redevance_ttc + grd_ttc) / 365) | round(4) }}

  - trigger:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - sensor.luminus_prix_kwh_ttc
          - sensor.luminus_cout_fixe_journalier
          - sensor.luminus_conso_jour
          - sensor.luminus_conso_mois
          - sensor.luminus_conso_annee
          - input_number.luminus_cout_accumulateur_mois
          - input_number.luminus_cout_accumulateur_annee
    sensor:
      - name: "Luminus Prix kWh EUR"
        unique_id: luminus_prix_kwh_eur
        icon: mdi:currency-eur
        unit_of_measurement: "EUR/kWh"
        device_class: monetary
        state: >
          {{ (states('sensor.luminus_prix_kwh_ttc') | float(0) / 100) | round(6) }}

      - name: "Luminus Cout Variable Jour"
        unique_id: luminus_cout_variable_jour
        icon: mdi:flash
        unit_of_measurement: "EUR"
        device_class: monetary
        state: >
          {% set kwh = states('sensor.luminus_conso_jour') | float(0) %}
          {% set prix = states('sensor.luminus_prix_kwh_ttc') | float(0) / 100 %}
          {{ (kwh * prix) | round(4) }}

      - name: "Luminus Cout Total Jour"
        unique_id: luminus_cout_total_jour
        icon: mdi:cash-check
        unit_of_measurement: "EUR"
        device_class: monetary
        state: >
          {% set kwh = states('sensor.luminus_conso_jour') | float(0) %}
          {% set prix = states('sensor.luminus_prix_kwh_ttc') | float(0) / 100 %}
          {% set fixe = states('sensor.luminus_cout_fixe_journalier') | float(0) %}
          {{ ((kwh * prix) + fixe) | round(4) }}

      - name: "Luminus Cout Total Mois"
        unique_id: luminus_cout_total_mois
        icon: mdi:cash-check
        unit_of_measurement: "EUR"
        device_class: monetary
        state: >
          {# Somme des jours déjà clôturés ce mois-ci (chacun figé avec le
             prix en vigueur ce jour-là) + la progression du jour en cours. #}
          {% set accumule = states('input_number.luminus_cout_accumulateur_mois') | float(0) %}
          {% set aujourdhui = states('sensor.luminus_cout_total_jour') | float(0) %}
          {{ (accumule + aujourdhui) | round(2) }}

      - name: "Luminus Cout Total Annee"
        unique_id: luminus_cout_total_annee
        icon: mdi:cash-check
        unit_of_measurement: "EUR"
        device_class: monetary
        state: >
          {# Même logique que le total mensuel, mais sur l'année entière. #}
          {% set accumule = states('input_number.luminus_cout_accumulateur_annee') | float(0) %}
          {% set aujourdhui = states('sensor.luminus_cout_total_jour') | float(0) %}
          {{ (accumule + aujourdhui) | round(2) }}

# =============================================================================
# Résumé quotidien + accumulation mensuelle/annuelle
# (avant la remise à zéro du compteur journalier à minuit)
#
# Le coût du jour, une fois clôturé, est ajouté tel quel aux accumulateurs
# mensuel/annuel : chaque jour reste figé avec le prix qui était en vigueur
# ce jour-là, donc un changement de tarif en cours de mois/année (ex. une
# indexation Luminus en septembre) n'écrase jamais rétroactivement les jours
# précédents.
# =============================================================================
automation:
  - id: luminus_resume_quotidien
    alias: "Luminus - Résumé quotidien du coût électricité"
    description: >
      Envoie une notification persistante récapitulant la consommation et le
      coût du jour, et ajoute le coût du jour (figé au prix du jour) aux
      accumulateurs mensuel/annuel, juste avant que le compteur journalier
      ne se remette à zéro à minuit.
    trigger:
      - trigger: time
        at: "23:55:00"
    action:
      - action: persistent_notification.create
        data:
          title: "Coût électricité Luminus - {{ now().strftime('%d/%m/%Y') }}"
          message: >
            Consommation : {{ states('sensor.luminus_conso_jour') }} kWh

            Prix appliqué : {{ states('sensor.luminus_prix_kwh_ttc') }} c€/kWh (TTC)

            Coût variable : {{ states('sensor.luminus_cout_variable_jour') }} €

            Coût fixe (redevance Luminus + terme fixe GRD) : {{ states('sensor.luminus_cout_fixe_journalier') }} €

            Coût total du jour : {{ states('sensor.luminus_cout_total_jour') }} €
          notification_id: luminus_resume_quotidien
      - action: input_number.set_value
        target:
          entity_id: input_number.luminus_cout_accumulateur_mois
        data:
          value: >
            {{ (states('input_number.luminus_cout_accumulateur_mois') | float(0)
                + states('sensor.luminus_cout_total_jour') | float(0)) | round(2) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.luminus_cout_accumulateur_annee
        data:
          value: >
            {{ (states('input_number.luminus_cout_accumulateur_annee') | float(0)
                + states('sensor.luminus_cout_total_jour') | float(0)) | round(2) }}
    mode: single

  - id: luminus_reset_accumulateur_mois
    alias: "Luminus - Reset accumulateur mensuel"
    description: "Remet l'accumulateur mensuel à 0 le 1er de chaque mois."
    trigger:
      - trigger: time
        at: "00:01:00"
    condition:
      - condition: template
        value_template: "{{ now().day == 1 }}"
    action:
      - action: input_number.set_value
        target:
          entity_id: input_number.luminus_cout_accumulateur_mois
        data:
          value: 0
    mode: single

  - id: luminus_reset_accumulateur_annee
    alias: "Luminus - Reset accumulateur annuel"
    description: "Remet l'accumulateur annuel à 0 le 1er janvier."
    trigger:
      - trigger: time
        at: "00:02:00"
    condition:
      - condition: template
        value_template: "{{ now().month == 1 and now().day == 1 }}"
    action:
      - action: input_number.set_value
        target:
          entity_id: input_number.luminus_cout_accumulateur_annee
        data:
          value: 0
    mode: single

  - id: luminus_appliquer_changement_prix_programme
    alias: "Luminus - Applique le changement de prix programmé"
    description: >
      Vérifie chaque heure si un changement de prix programmé
      (input_boolean.luminus_changement_prix_programme) est arrivé à sa date
      d'effet. Si oui, il remplace automatiquement le prix énergie en
      vigueur - que la date soit dans le futur (programmée à l'avance et
      appliquée pile le bon jour) ou déjà passée (encodée en retard : le
      nouveau prix s'applique immédiatement à partir de maintenant, mais ne
      corrige pas rétroactivement les jours déjà clôturés - utilise la
      correction manuelle pour ça).
    trigger:
      - trigger: time_pattern
        hours: "/1"
      - trigger: state
        entity_id:
          - input_boolean.luminus_changement_prix_programme
          - input_datetime.luminus_prix_energie_date_effet
          - input_number.luminus_prix_energie_ttc_prochain
    condition:
      - condition: state
        entity_id: input_boolean.luminus_changement_prix_programme
        state: "on"
      - condition: template
        value_template: >
          {{ now().date() >= strptime(states('input_datetime.luminus_prix_energie_date_effet'), '%Y-%m-%d').date() }}
      - condition: template
        value_template: "{{ states('input_number.luminus_prix_energie_ttc_prochain') | float(0) > 0 }}"
    action:
      - action: input_number.set_value
        target:
          entity_id: input_number.luminus_prix_energie_ttc
        data:
          value: "{{ states('input_number.luminus_prix_energie_ttc_prochain') | float(0) }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.luminus_changement_prix_programme
      - action: persistent_notification.create
        data:
          title: "Luminus - Nouveau prix appliqué"
          message: >
            Le prix énergie programmé ({{ states('input_number.luminus_prix_energie_ttc_prochain') }} c€/kWh)
            vient d'être appliqué. S'il aurait dû entrer en vigueur avant
            aujourd'hui, pense à utiliser la correction manuelle pour
            rattraper les jours concernés.
          notification_id: luminus_changement_prix_applique
    mode: single

  - id: luminus_appliquer_correction_manuelle
    alias: "Luminus - Applique la correction manuelle"
    description: >
      Sur pression du bouton, ajoute input_number.luminus_correction_manuelle
      aux accumulateurs mensuel et annuel (pour rattraper un prix encodé en
      retard), puis remet la correction à 0.
    trigger:
      - trigger: state
        entity_id: input_button.luminus_appliquer_correction_manuelle
    condition:
      - condition: template
        value_template: "{{ states('input_number.luminus_correction_manuelle') | float(0) != 0 }}"
    action:
      - action: input_number.set_value
        target:
          entity_id: input_number.luminus_cout_accumulateur_mois
        data:
          value: >
            {{ (states('input_number.luminus_cout_accumulateur_mois') | float(0)
                + states('input_number.luminus_correction_manuelle') | float(0)) | round(2) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.luminus_cout_accumulateur_annee
        data:
          value: >
            {{ (states('input_number.luminus_cout_accumulateur_annee') | float(0)
                + states('input_number.luminus_correction_manuelle') | float(0)) | round(2) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.luminus_correction_manuelle
        data:
          value: 0
    mode: single
