definir_mois_historique:
  name: Définir un mois dans l'historique
  description: >-
    Renseigne (ou corrige) la consommation et la production d'un mois
    donné. Le coût total, le prix moyen par kWh et le solde net sont
    recalculés automatiquement à partir des tarifs actuellement
    configurés. Utile pour importer l'historique depuis MyOres.
    Importe toujours les mois dans l'ordre chronologique (janvier,
    février, ...) : chaque mois reprend le cumul de compensation du
    mois précédent, importer dans le désordre fausse le calcul.
  fields:
    mois:
      name: Mois
      description: Au format AAAA-MM, par exemple 2026-01 pour janvier 2026.
      required: true
      example: "2026-01"
      selector:
        text:
    consommation_kwh:
      name: Consommation (kWh)
      description: Total prélevé du réseau ce mois-là, en kWh.
      required: true
      example: 350.5
      selector:
        number:
          min: 0
          max: 100000
          step: 0.1
          mode: box
          unit_of_measurement: kWh
    production_kwh:
      name: Production (kWh)
      description: Total injecté sur le réseau ce mois-là, en kWh.
      required: true
      example: 120.3
      selector:
        number:
          min: 0
          max: 100000
          step: 0.1
          mode: box
          unit_of_measurement: kWh

definir_cumul_periode:
  name: Définir le cumul net de la période tarifaire
  description: >-
    Recale le solde net (prélèvement − injection, en kWh) accumulé depuis
    le dernier changement de prix, jours clôturés uniquement - visible
    dans sensor.luminus_net_cumule_periode. À utiliser après une période
    où le suivi quotidien n'a pas fonctionné : ce cumul détermine la
    part de l'énergie injectée qui compense l'énergie prélevée.
  fields:
    cumul_kwh:
      name: Cumul net (kWh)
      description: Prélèvement − injection depuis le dernier changement de prix. Peut être négatif.
      required: true
      example: 812.4
      selector:
        number:
          min: -100000
          max: 100000
          step: 0.001
          mode: box
          unit_of_measurement: kWh
